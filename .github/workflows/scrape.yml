name: PhD Radar

on:
  schedule:
    # Every 3 days at 07:00 UTC (09:00 CEST)
    - cron: '0 7 */3 * *'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit results
        run: |
          git config user.name "PhD Radar Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "📡 PhD Radar update $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 212.1.208.34
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/
          server-dir: /domains/muhammadimran.com/public_html/phd-explorer/
